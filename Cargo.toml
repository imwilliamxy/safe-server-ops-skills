[package]
name = "safe-server-ops"
version = "0.2.0"
edition = "2021"
description = "Credential-isolated production server operations gateway (Progressive Skill + opsctl + opsd) for AI agents."
license = "MIT"

[lib]
name = "safe_server_ops"
path = "src/lib.rs"

[[bin]]
name = "opsd"
path = "src/bin/opsd.rs"

[[bin]]
name = "opsctl"
path = "src/bin/opsctl.rs"

[[bin]]
name = "ops-approve"
path = "src/bin/ops-approve.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
