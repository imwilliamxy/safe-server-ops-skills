# opsd main configuration (literal key=value, NEVER shell code)
# Copy to /Users/sshops/.local/config/opsd/opsd.conf and chmod 600 (owned by sshops)

servers_env = /Users/sshops/.local/config/opsd/.ssh-servers.env
policy = /Users/sshops/.local/config/opsd/policy.yaml
socket = /var/run/sshops/ops.sock
admin_socket = /var/run/sshops/admin.sock
audit_log = /Users/sshops/.local/state/opsd/audit.jsonl
socket_group = opsclients
check_ownership = true

# Embedded read-only Web monitoring dashboard (loopback only; set to "off" to disable)
web_listen = 127.0.0.1:10100

# Audit log rotation & output capture limits
audit_max_bytes = 20971520
audit_max_files = 5
audit_output_max_bytes = 4096
