<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>safe-server-ops · 运维审计监控台</title>
<style>
  :root {
    --bg: #f6f8fa;
    --bg-panel: #ffffff;
    --bg-subtle: #f0f3f6;
    --bg-hover: #eef2f6;
    --bg-active: #e8f1ff;
    --border: #d8dee4;
    --border-soft: #e6ebf0;
    --text: #1f2328;
    --text-muted: #59636e;
    --text-faint: #818b98;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --ok: #1a7f37;
    --ok-soft: #dafbe1;
    --warn: #9a6700;
    --warn-soft: #fff8c5;
    --err: #cf222e;
    --err-soft: #ffebe9;
    --l2: #8250df;
    --l2-soft: #fbefff;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --cmd-bg: #f4f6f8;
    --shadow: 0 1px 2px rgba(31, 35, 40, 0.05);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", sans-serif;
    --font-mono: "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, monospace;
  }

  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --bg-subtle: #1c2128;
    --bg-hover: #21262d;
    --bg-active: #162742;
    --border: #30363d;
    --border-soft: #262c34;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-faint: #6e7681;
    --accent: #58a6ff;
    --accent-soft: rgba(56, 139, 253, 0.16);
    --ok: #3fb950;
    --ok-soft: rgba(46, 160, 67, 0.16);
    --warn: #d29922;
    --warn-soft: rgba(187, 128, 9, 0.18);
    --err: #f85149;
    --err-soft: rgba(248, 81, 73, 0.16);
    --l2: #bc8cff;
    --l2-soft: rgba(163, 113, 247, 0.16);
    --code-bg: #090d13;
    --code-text: #d0d7de;
    --cmd-bg: #0d1117;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Bar */
  .topbar {
    height: 52px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .brand-logo {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, #0969da, #8250df);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }
  .brand-title {
    font-weight: 650;
    font-size: 14px;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .badge-ro {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg-subtle);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: var(--bg-subtle);
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
  }
  .live-dot.connected { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .live-dot.error { background: var(--err); }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-chip {
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 9px;
    border-radius: 6px;
    background: var(--bg-subtle);
    white-space: nowrap;
  }
  .stat-chip b { color: var(--text); font-weight: 600; }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--text-faint); }
  .btn-pending {
    border-color: var(--warn);
    background: var(--warn-soft);
    color: var(--warn);
    font-weight: 600;
  }
  .btn-pending.has-pending { animation: pulseWarn 2.2s infinite; }
  @keyframes pulseWarn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210, 153, 34, 0.35); }
    50% { box-shadow: 0 0 0 5px rgba(210, 153, 34, 0); }
  }
  .btn-sm { padding: 3px 8px; font-size: 11px; }

  /* Two-Column Workspace */
  .workspace {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  /* Left Sidebar: Agent Sessions */
  .sidebar {
    width: 330px;
    min-width: 270px;
    max-width: 420px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-title {
    font-size: 12px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .input, .select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 9px;
    font: inherit;
    font-size: 12px;
    outline: none;
  }
  .input:focus, .select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .sidebar-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .toggle-row label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
  }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .session-card {
    flex-shrink: 0;
    border: 1px solid var(--border-soft);
    background: var(--bg-panel);
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    text-align: left;
    width: 100%;
    color: inherit;
    font: inherit;
  }
  .session-card:hover { background: var(--bg-hover); border-color: var(--border); }
  .session-card.active {
    background: var(--bg-active);
    border-color: var(--accent);
    box-shadow: var(--shadow);
  }
  .session-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
  }
  .session-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-time {
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .session-meta {
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 600;
    background: var(--bg-subtle);
    color: var(--text-muted);
    border: 1px solid var(--border-soft);
  }
  .pill-agent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill-srv { font-family: var(--font-mono); font-weight: 500; }
  .pill-err { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .pill-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill-l2 { background: var(--l2-soft); color: var(--l2); border-color: transparent; }

  .session-stats {
    margin-top: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-faint);
  }

  /* Right Main Content */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
  }

  /* Pending Banner */
  .pending-drawer {
    background: var(--warn-soft);
    border-bottom: 1px solid var(--warn);
    padding: 10px 16px;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
  .pending-drawer.open { display: block; }
  .pending-drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 650;
    color: var(--warn);
  }
  .pending-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pending-item {
    flex-shrink: 0;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 7px;
    padding: 9px 11px;
  }
  .pending-item.high-risk { border-left-color: var(--err); }
  .pending-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .approve-cmd-box {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cmd-bg);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    padding: 5px 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }
  .approve-cmd-box code {
    flex: 1;
    overflow-x: auto;
    white-space: nowrap;
  }

  /* Session Detail Header + Filters */
  .main-header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }
  .detail-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .detail-title {
    font-size: 16px;
    font-weight: 650;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .detail-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }
  .mono { font-family: var(--font-mono); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .toolbar .input { width: 220px; }
  .toolbar .select { width: auto; min-width: 130px; }

  .risk-tabs {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg);
  }
  .risk-tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 9px;
    cursor: pointer;
    border-right: 1px solid var(--border-soft);
  }
  .risk-tab:last-child { border-right: none; }
  .risk-tab.active { background: var(--accent); color: #fff; }

  /* Command Timeline List */
  .records-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .record-card {
    flex-shrink: 0;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color 0.12s;
  }
  .record-card.failed { border-left: 3px solid var(--err); }
  .record-card.high-risk { border-left: 3px solid var(--err); }
  .record-card.token-highlight {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .record-head {
    height: 76px;
    padding: 0 13px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
  }
  .record-head:hover { background: var(--bg-hover); }
  .record-meta-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
    height: 22px;
  }
  .record-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    flex-wrap: nowrap;
  }
  .record-badges > * {
    flex-shrink: 0;
  }
  .record-badges .pill-target {
    flex-shrink: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 240px;
  }
  .record-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .expand-caret {
    display: inline-block;
    width: 12px;
    text-align: center;
    color: var(--text-faint);
    transition: transform 0.15s;
  }
  .record-card.expanded .expand-caret {
    transform: rotate(90deg);
    color: var(--accent);
  }
  .cmd-line {
    background: var(--cmd-bg);
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 4px 9px;
    height: 28px;
    line-height: 18px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cmd-line.is-remote {
    background: var(--code-bg);
    border-color: transparent;
    color: #93c5fd;
  }
  .cmd-reason-inline {
    color: var(--text-faint);
    font-family: var(--font-sans);
    font-size: 11.5px;
    margin-left: 10px;
  }
  .warnings-bar {
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .warning-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--err);
    background: var(--err-soft);
    padding: 4px 8px;
    border-radius: 5px;
  }

  /* Expanded Record Details */
  .record-body {
    display: none;
    border-top: 1px solid var(--border-soft);
    padding: 11px 13px 13px;
    background: var(--bg-subtle);
  }
  .record-card.expanded .record-body { display: block; }
  .section-label {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 10px 0 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-label:first-child { margin-top: 0; }
  .code-block {
    margin: 0;
    padding: 9px 11px;
    border-radius: 6px;
    background: var(--code-bg);
    color: var(--code-text);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.5;
    max-height: 320px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .diff-add { color: #4ade80; }
  .diff-del { color: #f87171; }
  .diff-hunk { color: #60a5fa; }
  .meta-kv {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .token-btn {
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 10.5px;
    border-radius: 5px;
    padding: 1px 6px;
    cursor: pointer;
  }
  .token-btn:hover { background: var(--accent-soft); }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
  }
  .load-more-wrap {
    flex-shrink: 0;
    text-align: center;
    padding: 10px 0 20px;
  }

  @media (max-width: 820px) {
    .workspace { flex-direction: column; }
    .sidebar {
      width: 100%;
      max-width: none;
      max-height: 38vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">op</div>
      <span class="brand-title">safe-server-ops 审计监控台</span>
      <span class="badge-ro">READ-ONLY</span>
      <span class="live-pill" id="livePill" title="SSE 实时事件推送状态">
        <span class="live-dot" id="liveDot"></span>
        <span id="liveText">连接中...</span>
      </span>
    </div>
    <div class="top-actions">
      <span class="stat-chip" id="statSessions">会话 <b>0</b></span>
      <span class="stat-chip" id="statRecords">记录 <b>0</b></span>
      <span class="stat-chip" id="statErrors">异常 <b>0</b></span>
      <button class="btn btn-pending" id="btnPending" type="button">
        待审批 <span id="pendingCount">0</span>
      </button>
      <button class="btn" id="btnRefresh" type="button">刷新</button>
      <button class="btn" id="btnTheme" type="button">切换主题</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Left Column: Agent Session List -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <span class="sidebar-title">Agent Sessions</span>
          <span class="mono" style="font-size:11px;color:var(--text-faint)" id="sidebarCount">0</span>
        </div>
        <input class="input" id="sessionSearch" type="search" placeholder="搜索会话标题 / 项目 / 服务器..." />
        <div class="sidebar-filters">
          <select class="select" id="sidebarServer">
            <option value="">全部服务器</option>
          </select>
          <select class="select" id="sidebarAgent">
            <option value="">全部 Agent</option>
          </select>
        </div>
        <div class="toggle-row">
          <label><input type="checkbox" id="sidebarOnlyErr" /> 仅看含异常</label>
          <label><input type="checkbox" id="sidebarOnlyWrites" /> 仅看含写操作</label>
        </div>
      </div>
      <div class="session-list" id="sessionList"></div>
    </aside>

    <!-- Right Column: Selected Session Command Calls -->
    <main class="main">
      <section class="pending-drawer" id="pendingDrawer">
        <div class="pending-drawer-head">
          <span>待人工审批计划（仅只读展示，请复制命令至终端经 Touch ID / 密码批准）</span>
          <button class="btn btn-sm" id="btnClosePending" type="button">收起</button>
        </div>
        <div class="pending-grid" id="pendingGrid"></div>
      </section>

      <section class="main-header">
        <div>
          <div class="detail-title-row">
            <h1 class="detail-title" id="detailTitle">全部会话 (All Sessions)</h1>
            <span class="mono" style="font-size:11.5px;color:var(--text-faint)" id="recordCounter"></span>
          </div>
          <div class="detail-sub" id="detailSub"></div>
        </div>
        <div class="toolbar">
          <input class="input" id="recordSearch" type="search" placeholder="搜索命令 / 理由 / 输出 / Token..." />
          <select class="select" id="recordServer">
            <option value="">全部服务器</option>
          </select>
          <div class="risk-tabs" id="riskTabs">
            <button class="risk-tab active" data-risk="" type="button">全部</button>
            <button class="risk-tab" data-risk="L0" type="button">L0 只读</button>
            <button class="risk-tab" data-risk="L1" type="button">L1 重启</button>
            <button class="risk-tab" data-risk="L2" type="button">L2 变更</button>
            <button class="risk-tab" data-risk="ADMIN" type="button">Admin</button>
          </div>
          <label style="font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer">
            <input type="checkbox" id="recordOnlyErr" /> 仅失败
          </label>
          <label style="font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer">
            <input type="checkbox" id="recordOnlyHighRisk" /> 仅高危
          </label>
        </div>
      </section>

      <section class="records-scroll" id="recordsContainer">
        <div class="empty-state">正在加载命令调用记录...</div>
      </section>
    </main>
  </div>

<script>
(() => {
  const PAGE_SIZE = 100;
  const state = {
    overview: null,
    sessions: [],
    pending: [],
    selectedSessionId: '__all__',
    records: [],
    recordsTotal: 0,
    recordsHasMore: false,
    recordsOffset: 0,
    expandedIds: new Set(),
    highlightedToken: null,
    riskFilter: '',
    pendingOpen: false,
    sse: null,
    refreshTimer: null,
  };

  const $ = (id) => document.getElementById(id);

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatRelTime(iso) {
    if (!iso) return '';
    const t = Date.parse(iso);
    if (Number.isNaN(t)) return iso;
    const diff = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (diff < 10) return '刚刚';
    if (diff < 60) return `${diff}秒前`;
    if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}小时前`;
    return `${Math.floor(diff / 86400)}天前`;
  }

  function formatShortTs(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function formatAgentBadge(agent, hostApp) {
    const a = agent || 'unknown';
    if (hostApp && hostApp.toLowerCase() !== a.toLowerCase()) {
      return `${hostApp} · ${a}`;
    }
    return a;
  }

  function renderDiffHtml(diff) {
    return diff.split('\n').map((line) => {
      const safe = esc(line);
      if (line.startsWith('+') && !line.startsWith('+++')) return `<span class="diff-add">${safe}</span>`;
      if (line.startsWith('-') && !line.startsWith('---')) return `<span class="diff-del">${safe}</span>`;
      if (line.startsWith('@@')) return `<span class="diff-hunk">${safe}</span>`;
      return safe;
    }).join('\n');
  }

  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = orig; }, 1200);
      }
    } catch (_) {
      window.prompt('复制以下命令：', text);
    }
  }

  async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function populateServerSelects(servers) {
    const aliases = (servers || []).map((s) => s.alias);
    for (const sid of ['sidebarServer', 'recordServer']) {
      const el = $(sid);
      const cur = el.value;
      const opts = ['<option value="">全部服务器</option>']
        .concat(aliases.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`));
      el.innerHTML = opts.join('');
      if (aliases.includes(cur)) el.value = cur;
    }
  }

  function populateAgentSelect(sessions) {
    const el = $('sidebarAgent');
    const cur = el.value;
    const set = new Set();
    for (const s of sessions) {
      if (s.agent) set.add(s.agent);
    }
    const agents = Array.from(set).sort();
    el.innerHTML = ['<option value="">全部 Agent</option>']
      .concat(agents.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`))
      .join('');
    if (agents.includes(cur)) el.value = cur;
  }

  async function loadOverview() {
    const data = await fetchJson('/api/overview');
    state.overview = data;
    $('statSessions').innerHTML = `会话 <b>${data.stats.total_sessions}</b>`;
    $('statRecords').innerHTML = `记录 <b>${data.stats.total_in_memory}</b>`;
    $('statErrors').innerHTML = `异常 <b>${data.stats.error_calls}</b>`;
    $('pendingCount').textContent = String(data.pending_count || 0);
    const btnP = $('btnPending');
    btnP.classList.toggle('has-pending', (data.pending_count || 0) > 0);
    populateServerSelects(data.servers || []);
  }

  async function loadPending() {
    const data = await fetchJson('/api/pending');
    state.pending = data.pending || [];
    $('pendingCount').textContent = String(state.pending.length);
    $('btnPending').classList.toggle('has-pending', state.pending.length > 0);
    renderPendingDrawer();
  }

  function renderPendingDrawer() {
    const drawer = $('pendingDrawer');
    const grid = $('pendingGrid');
    const shouldShow = state.pendingOpen || state.pending.length > 0;
    drawer.classList.toggle('open', shouldShow && state.pending.length > 0);
    if (!state.pending.length) {
      grid.innerHTML = '';
      return;
    }
    grid.innerHTML = state.pending.map((p) => {
      const warns = p.risk_warnings || [];
      const cmd = `sudo -u sshops /Users/sshops/.local/bin/ops-approve approve ${p.plan_token}`;
      const showCmd = `sudo -u sshops /Users/sshops/.local/bin/ops-approve --show ${p.plan_token}`;
      const warnHtml = warns.length
        ? `<div class="warnings-bar">${warns.map((w) => `<span class="warning-tag">⚠ ${esc(w)}</span>`).join('')}</div>`
        : '';
      const diffHtml = p.diff
        ? `<pre class="code-block" style="margin-top:6px;max-height:110px">${renderDiffHtml(p.diff)}</pre>`
        : '';
      return `
        <div class="pending-item ${warns.length ? 'high-risk' : ''}">
          <div class="pending-row">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="pill pill-warn">${esc(p.kind)}</span>
              <span class="pill pill-srv">${esc(p.server)}</span>
              ${p.target ? `<span class="pill">${esc(p.target)}</span>` : ''}
              ${p.session_title ? `<span class="pill pill-agent">${esc(p.session_title)}</span>` : ''}
            </div>
            <span class="mono" style="font-size:11.5px;color:var(--warn);font-weight:600">剩余 ${esc(p.expires_in_seconds)}s</span>
          </div>
          <div style="margin-top:4px;font-size:12px"><b>${esc(p.summary)}</b>${p.reason ? ` · 理由：${esc(p.reason)}` : ''}</div>
          ${warnHtml}
          ${diffHtml}
          <div class="approve-cmd-box">
            <code>${esc(cmd)}</code>
            <button class="btn btn-sm" type="button" data-copy="${esc(cmd)}">复制批准命令</button>
            <button class="btn btn-sm" type="button" data-copy="${esc(showCmd)}">复制查看命令</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadSessions() {
    const params = new URLSearchParams();
    const q = $('sessionSearch').value.trim();
    const srv = $('sidebarServer').value;
    const ag = $('sidebarAgent').value;
    if (q) params.set('q', q);
    if (srv) params.set('server', srv);
    if (ag) params.set('agent', ag);
    if ($('sidebarOnlyErr').checked) params.set('only_errors', '1');
    if ($('sidebarOnlyWrites').checked) params.set('only_writes', '1');

    const data = await fetchJson(`/api/sessions?${params.toString()}`);
    state.sessions = data.sessions || [];
    $('sidebarCount').textContent = String(state.sessions.length);
    if (!q && !srv && !ag && !$('sidebarOnlyErr').checked && !$('sidebarOnlyWrites').checked) {
      populateAgentSelect(state.sessions);
    }
    renderSessionList();
    renderSessionHeader();
  }

  function renderSessionList() {
    const list = $('sessionList');
    const totalAll = state.overview?.stats?.total_in_memory ?? 0;
    const errAll = state.overview?.stats?.error_calls ?? 0;
    const allCard = `
      <button type="button" class="session-card ${state.selectedSessionId === '__all__' ? 'active' : ''}" data-sid="__all__">
        <div class="session-top">
          <span class="session-name">全部会话 (All Sessions)</span>
          <span class="session-time">${state.sessions.length} 个会话</span>
        </div>
        <div class="session-stats">
          <span>共 ${totalAll} 条调用</span>
          ${errAll > 0 ? `<span class="pill pill-err">异常 ${errAll}</span>` : ''}
        </div>
      </button>
    `;

    const cards = state.sessions.map((s) => {
      const active = state.selectedSessionId === s.session_id ? 'active' : '';
      const srvPills = (s.servers || []).slice(0, 3)
        .map((sv) => `<span class="pill pill-srv">${esc(sv)}</span>`)
        .join('');
      const moreSrv = (s.servers || []).length > 3
        ? `<span class="pill">+${s.servers.length - 3}</span>` : '';
      return `
        <button type="button" class="session-card ${active}" data-sid="${esc(s.session_id)}">
          <div class="session-top">
            <span class="session-name" title="${esc(s.title)}">${esc(s.title)}</span>
            <span class="session-time" title="${esc(s.last_ts)}">${esc(formatRelTime(s.last_ts))}</span>
          </div>
          <div class="session-meta">
            <span class="pill pill-agent">${esc(formatAgentBadge(s.agent, s.host_app))}</span>
            ${s.project_name ? `<span class="pill">${esc(s.project_name)}</span>` : ''}
            ${srvPills}${moreSrv}
          </div>
          <div class="session-stats">
            <span>调用 ${s.total_calls} · 变更 ${s.write_calls}</span>
            <span style="display:flex;gap:4px">
              ${s.pending_count > 0 ? `<span class="pill pill-warn">待批 ${s.pending_count}</span>` : ''}
              ${s.high_risk_calls > 0 ? `<span class="pill pill-err">高危 ${s.high_risk_calls}</span>` : ''}
              ${s.error_calls > 0 ? `<span class="pill pill-err">错 ${s.error_calls}</span>` : ''}
            </span>
          </div>
        </button>
      `;
    }).join('');

    list.innerHTML = allCard + (cards || '<div class="empty-state" style="padding:24px 8px">暂无匹配的 Agent 会话</div>');
  }

  function renderSessionHeader() {
    if (state.selectedSessionId === '__all__') {
      $('detailTitle').textContent = '全部会话 (All Sessions)';
      $('detailSub').innerHTML = '<span>按时间倒序显示所有 Agent 会话近期的命令调用</span>';
      return;
    }
    const s = state.sessions.find((x) => x.session_id === state.selectedSessionId);
    if (!s) {
      $('detailTitle').textContent = state.selectedSessionId;
      $('detailSub').innerHTML = '';
      return;
    }
    $('detailTitle').textContent = s.title;
    const parts = [
      `<span class="pill pill-agent">${esc(formatAgentBadge(s.agent, s.host_app))}</span>`,
      `<span class="mono" title="Session ID">${esc(s.session_id)}</span>`,
    ];
    if (s.cwd) parts.push(`<span class="mono" title="工作目录">${esc(s.cwd)}</span>`);
    parts.push(`<span>活跃：${esc(formatShortTs(s.first_ts))} ~ ${esc(formatShortTs(s.last_ts))}</span>`);
    $('detailSub').innerHTML = parts.join('');
  }

  async function loadRecords(append = false) {
    const offset = append ? state.recordsOffset : 0;
    const params = new URLSearchParams();
    params.set('limit', String(PAGE_SIZE));
    params.set('offset', String(offset));
    const q = $('recordSearch').value.trim();
    const srv = $('recordServer').value;
    if (q) params.set('q', q);
    if (srv) params.set('server', srv);
    if (state.riskFilter) params.set('risk', state.riskFilter);
    if ($('recordOnlyErr').checked) params.set('only_errors', '1');
    if ($('recordOnlyHighRisk').checked) params.set('only_high_risk', '1');

    const sid = encodeURIComponent(state.selectedSessionId);
    const page = await fetchJson(`/api/sessions/${sid}/records?${params.toString()}`);

    if (append) {
      state.records = state.records.concat(page.records || []);
    } else {
      state.records = page.records || [];
    }
    state.recordsTotal = page.total || 0;
    state.recordsHasMore = Boolean(page.has_more);
    state.recordsOffset = state.records.length;

    $('recordCounter').textContent = `显示 ${state.records.length} / 共 ${state.recordsTotal} 条`;
    renderRecords();
  }

  function riskBadgeClass(rl) {
    switch ((rl || '').toUpperCase()) {
      case 'L1': return 'pill-warn';
      case 'L2': return 'pill-l2';
      case 'ADMIN': return 'pill-ok';
      default: return '';
    }
  }

  function renderRecords() {
    const box = $('recordsContainer');
    if (!state.records.length) {
      box.innerHTML = '<div class="empty-state">当前条件下暂无命令调用记录</div>';
      return;
    }

    const html = state.records.map((r) => {
      const isFailed = !r.ok || (typeof r.exit_code === 'number' && r.exit_code !== 0);
      const warns = r.risk_warnings || [];
      const expanded = state.expandedIds.has(r.id) ? 'expanded' : '';
      const tokHi = state.highlightedToken && r.plan_token_id === state.highlightedToken ? 'token-highlight' : '';
      const cls = [
        'record-card',
        isFailed ? 'failed' : '',
        warns.length ? 'high-risk' : '',
        expanded,
        tokHi,
      ].filter(Boolean).join(' ');

      const statusPill = isFailed
        ? `<span class="pill pill-err">${r.ok ? `EXIT ${r.exit_code}` : 'DENIED / ERR'}</span>`
        : '<span class="pill pill-ok">OK</span>';

      const mainCmd = r.cli_command || `opsctl ${r.action}`;
      const previewCmd = r.remote_command ? `$ ${r.remote_command}` : mainCmd;
      const reasonInline = r.reason
        ? `<span class="cmd-reason-inline"># ${esc(r.reason)}</span>`
        : '';
      const warnsBodyHtml = warns.length
        ? `<div class="warnings-bar">${warns.map((w) => `<span class="warning-tag">⚠ ${esc(w)}</span>`).join('')}</div>`
        : '';
      const reasonBodyHtml = r.reason
        ? `<div style="margin-bottom:8px;font-size:12px;color:var(--text-muted)"><b>操作理由：</b>${esc(r.reason)}</div>`
        : '';

      const diffSection = r.diff_preview
        ? `<div class="section-label"><span>变更 Diff / 预演</span></div>
           <pre class="code-block">${renderDiffHtml(r.diff_preview)}</pre>`
        : '';
      const outSection = r.output_preview
        ? `<div class="section-label"><span>命令输出 / 报错（已脱敏）</span><button class="btn btn-sm" type="button" data-copy="${esc(r.output_preview)}">复制输出</button></div>
           <pre class="code-block">${esc(r.output_preview)}</pre>`
        : '';

      const summarySection = r.summary && !r.output_preview
        ? `<div class="section-label"><span>摘要</span></div>
           <pre class="code-block">${esc(r.summary)}</pre>`
        : '';

      return `
        <article class="${cls}" data-id="${r.id}">
          <div class="record-head" data-toggle="${r.id}">
            <div class="record-meta-line">
              <div class="record-badges">
                <span class="pill ${riskBadgeClass(r.risk_level)}">${esc(r.risk_level || 'L0')}</span>
                ${statusPill}
                ${warns.length ? `<span class="pill pill-err" title="${esc(warns.join('; '))}">⚠ 高危 ${warns.length}</span>` : ''}
                <span class="pill mono">${esc(r.action)}</span>
                ${r.server ? `<span class="pill pill-srv">${esc(r.server)}</span>` : ''}
                ${r.target ? `<span class="pill mono pill-target" title="${esc(r.target)}">${esc(r.target)}</span>` : ''}
                ${r.plan_token_id ? `<button type="button" class="token-btn" data-token="${esc(r.plan_token_id)}" title="点击高亮同审批单链路">${esc(r.plan_token_id)}</button>` : ''}
                ${r.approved_by ? `<span class="pill pill-ok">✓ ${esc(r.approved_by)}</span>` : ''}
              </div>
              <div class="record-right">
                ${typeof r.duration_ms === 'number' ? `<span>${r.duration_ms}ms</span>` : ''}
                <span title="${esc(r.ts)}">${esc(formatShortTs(r.ts))}</span>
                <span class="expand-caret">▸</span>
              </div>
            </div>
            <div class="cmd-line ${r.remote_command ? 'is-remote' : ''}" title="${esc(previewCmd)}">${esc(previewCmd)}${reasonInline}</div>
          </div>
          <div class="record-body">
            ${warnsBodyHtml}
            ${reasonBodyHtml}
            <div class="section-label">
              <span>调用命令</span>
              <button class="btn btn-sm" type="button" data-copy="${esc(r.remote_command || mainCmd)}">复制命令</button>
            </div>
            <pre class="code-block">${esc(mainCmd)}${r.remote_command ? `\n\n# Remote command:\n$ ${esc(r.remote_command)}` : ''}</pre>
            ${diffSection}
            ${outSection}
            ${summarySection}
            <div class="meta-kv mono">
              ${r.session_id ? `<span>session=${esc(r.session_id)}</span>` : ''}
              ${r.agent ? `<span>agent=${esc(formatAgentBadge(r.agent, r.host_app))}</span>` : ''}
              ${r.peer_pid ? `<span>pid=${esc(r.peer_pid)}</span>` : ''}
              ${typeof r.peer_uid === 'number' ? `<span>uid=${esc(r.peer_uid)}</span>` : ''}
              ${r.cwd ? `<span>cwd=${esc(r.cwd)}</span>` : ''}
            </div>
          </div>
        </article>
      `;
    }).join('');

    const loadMore = state.recordsHasMore
      ? `<div class="load-more-wrap"><button class="btn" id="btnLoadMore" type="button">加载更多（剩余 ${state.recordsTotal - state.records.length} 条）</button></div>`
      : '';

    box.innerHTML = html + loadMore;
  }

  async function refreshAll() {
    try {
      await Promise.all([loadOverview(), loadPending(), loadSessions()]);
      await loadRecords(false);
    } catch (e) {
      console.error('Refresh error:', e);
    }
  }

  function scheduleRefresh() {
    if (state.refreshTimer) clearTimeout(state.refreshTimer);
    state.refreshTimer = setTimeout(() => {
      state.refreshTimer = null;
      refreshAll();
    }, 280);
  }

  function connectSSE() {
    if (state.sse) state.sse.close();
    const dot = $('liveDot');
    const txt = $('liveText');
    const es = new EventSource('/api/events');
    state.sse = es;

    es.addEventListener('connected', () => {
      dot.className = 'live-dot connected';
      txt.textContent = '实时同步';
    });
    es.addEventListener('audit', () => scheduleRefresh());
    es.addEventListener('pending', () => {
      loadPending();
      loadOverview();
    });
    es.addEventListener('reload', () => scheduleRefresh());
    es.onerror = () => {
      dot.className = 'live-dot error';
      txt.textContent = '重连中...';
    };
  }

  // Event bindings
  $('sessionList').addEventListener('click', (e) => {
    const btn = e.target.closest('.session-card');
    if (!btn) return;
    state.selectedSessionId = btn.dataset.sid || '__all__';
    state.highlightedToken = null;
    renderSessionList();
    renderSessionHeader();
    loadRecords(false);
  });

  $('recordsContainer').addEventListener('click', (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      e.stopPropagation();
      copyText(copyBtn.dataset.copy || '', copyBtn);
      return;
    }
    const tokBtn = e.target.closest('[data-token]');
    if (tokBtn) {
      e.stopPropagation();
      const tok = tokBtn.dataset.token;
      state.highlightedToken = state.highlightedToken === tok ? null : tok;
      renderRecords();
      return;
    }
    const moreBtn = e.target.closest('#btnLoadMore');
    if (moreBtn) {
      loadRecords(true);
      return;
    }
    const head = e.target.closest('[data-toggle]');
    if (head) {
      const id = Number(head.dataset.toggle);
      if (state.expandedIds.has(id)) state.expandedIds.delete(id);
      else state.expandedIds.add(id);
      const card = head.closest('.record-card');
      if (card) card.classList.toggle('expanded', state.expandedIds.has(id));
    }
  });

  $('pendingDrawer').addEventListener('click', (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      copyText(copyBtn.dataset.copy || '', copyBtn);
    }
  });

  $('btnPending').addEventListener('click', () => {
    state.pendingOpen = !state.pendingOpen;
    if (state.pendingOpen && !state.pending.length) {
      loadPending();
    } else {
      $('pendingDrawer').classList.toggle('open', state.pendingOpen && state.pending.length > 0);
    }
  });
  $('btnClosePending').addEventListener('click', () => {
    state.pendingOpen = false;
    $('pendingDrawer').classList.remove('open');
  });
  $('btnRefresh').addEventListener('click', () => refreshAll());

  // Theme toggle
  const savedTheme = localStorage.getItem('opsd_theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', savedTheme);
  $('btnTheme').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('opsd_theme', next);
  });

  // Filters
  let sessionSearchTimer = null;
  $('sessionSearch').addEventListener('input', () => {
    clearTimeout(sessionSearchTimer);
    sessionSearchTimer = setTimeout(loadSessions, 180);
  });
  $('sidebarServer').addEventListener('change', loadSessions);
  $('sidebarAgent').addEventListener('change', loadSessions);
  $('sidebarOnlyErr').addEventListener('change', loadSessions);
  $('sidebarOnlyWrites').addEventListener('change', loadSessions);

  let recordSearchTimer = null;
  $('recordSearch').addEventListener('input', () => {
    clearTimeout(recordSearchTimer);
    recordSearchTimer = setTimeout(() => loadRecords(false), 180);
  });
  $('recordServer').addEventListener('change', () => loadRecords(false));
  $('recordOnlyErr').addEventListener('change', () => loadRecords(false));
  $('recordOnlyHighRisk').addEventListener('change', () => loadRecords(false));

  $('riskTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.risk-tab');
    if (!tab) return;
    state.riskFilter = tab.dataset.risk || '';
    for (const el of $('riskTabs').querySelectorAll('.risk-tab')) {
      el.classList.toggle('active', el === tab);
    }
    loadRecords(false);
  });

  // Periodically refresh pending countdowns
  setInterval(() => {
    if (state.pending.length > 0) loadPending();
  }, 5000);

  refreshAll();
  connectSSE();
})();
</script>
</body>
</html>
