[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-server-ops"
version = "0.1.0"
description = "Credential-isolated production server operations gateway (Skill + opsctl + opsd) for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
]

[project.scripts]
opsctl = "safe_server_ops.cli:main"
opsd = "safe_server_ops.daemon:main"
ops-approve = "safe_server_ops.approve_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
